<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <!-- Avatar: preenchido via Ajax -->
            <img
                class="profile-avatar"
                id="profile-avatar"
                src="https://via.placeholder.com/180x180"
                alt="Avatar do perfil"
            />
            <!-- Nome: preenchido via Ajax -->
            <h1 class="profile-name" id="profile-name">Carregando...</h1>
            <!-- Username: preenchido via Ajax -->
            <h2 class="profile-username" id="profile-username">@...</h2>

            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <!-- Repositórios: preenchido via Ajax -->
                    <span id="profile-repos">-</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <!-- Seguidores: preenchido via Ajax -->
                    <span id="profile-followers">-</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <!-- Seguindo: preenchido via Ajax -->
                    <span id="profile-following">-</span>
                </li>
            </ul>

            <!-- Link do perfil: preenchido via Ajax -->
            <a href="#" id="profile-link" class="profile-link" target="_blank">
                Ver no Github
            </a>
        </div>
    </header>

    <script src="main.js"></script>
</body>
</html>
